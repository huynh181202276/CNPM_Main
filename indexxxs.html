<!DOCTYPE html>

  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->

  <!-- Google Fonts: Great Vibes & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- LZ-String Compression Library -->

    }
    ::-webkit-scrollbar-thumb {

<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="app" class="max-w-4xl mx-auto min-h-screen bg-white shadow-2xl relative flex flex-col">
    <!-- Dynamic Content populated via JS -->
  </div>

  <!-- Toast Notification System -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2"></div>

  <!-- Fullscreen Lightbox Modal -->
  <div id="lightbox" class="fixed inset-0 bg-black/90 z-50 hidden flex flex-col justify-between p-4 backdrop-blur-sm transition-opacity duration-300">
    <div class="flex justify-between items-center text-white px-2">
      <span id="lightbox-counter" class="text-sm font-medium tracking-wide">1 / 10</span>
      <button onclick="closeLightbox()" class="text-3xl hover:text-rose-400 transition-colors p-2">&times;</button>
    </div>
    <div class="relative flex-1 flex items-center justify-center my-auto overflow-hidden">
      <img id="lightbox-img" src="" alt="Zoomed image" class="max-h-[80vh] max-w-full object-contain rounded-lg shadow-2xl transition-all duration-300">
      <button onclick="prevLightboxImage()" class="absolute left-2 bg-black/50 text-white hover:bg-rose-600 rounded-full w-10 h-10 flex items-center justify-center transition-all">
        <i class="fas fa-chevron-left"></i>
      </button>
      <button onclick="nextLightboxImage()" class="absolute right-2 bg-black/50 text-white hover:bg-rose-600 rounded-full w-10 h-10 flex items-center justify-center transition-all">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
    <div id="lightbox-caption" class="text-center text-slate-300 text-sm py-2 italic font-light"></div>
  </div>

  <script>
    // State Data Structure
    let weddingData = {

      brideName: 'Lê Thị Mai',
      brideFamily: 'Ông: Lê Văn D & Bà: Phạm Thị E',
      weddingDate: '2026-11-20',
      weddingTime: '11:00',
      venueName: 'Trung Tâm Tiệc Cưới Luxury Palace',
      venueAddress: '123 Đường Nguyễn Huệ, Quận 1, TP. Hồ Chí Minh',
      mapUrl: 'https://maps.google.com',
      bankGroomName: 'Nguyễn Văn Anh',
      bankGroomNumber: '1234567890',
      bankGroomBank: 'Vietcombank',
      bankBrideName: 'Lê Thị Mai',
      bankBrideNumber: '0987654321',
      bankBrideBank: 'Techcombank',
      photos: [
        'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1583939003579-730e3918a45a?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1518105779142-d975f22f1b0a?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1520854221256-17451cc331bf?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1522673607200-164d1b6ce486?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1529636798458-92182e662485?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1532712938310-34cb3982ef74?auto=format&fit=crop&w=800&q=80',
        'https://images.unsplash.com/photo-1523438885200-e635ba2c371e?auto=format&fit=crop&w=800&q=80'

    let activeTab = 'info';

    let isViewMode = false;

    // Toast Utility
    function showToast(msg, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-rose-600' : 'bg-slate-800';
      toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2 transform transition-all duration-300 translate-y-2 opacity-0`;
      toast.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-circle' : 'fa-info-circle'}"></i> ${msg}`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      }, 50);

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // App Initialization
    window.onload = function() {
      parseUrlParams();
      renderApp();
      if (isViewMode) {
        startCountdown();
      }
    };

    // Compress & Pack Data into URL Hash
    function generateCompactPayload() {
      // Create minimal object to compress size drastically
      const minData = {
        gn: weddingData.groomName,
        gf: weddingData.groomFamily,
        bn: weddingData.brideName,
        bf: weddingData.brideFamily,
        d: weddingData.weddingDate,
        t: weddingData.weddingTime,
        vn: weddingData.venueName,
        va: weddingData.venueAddress,
        mu: weddingData.mapUrl,
        bgn: weddingData.bankGroomName,
        bgb: weddingData.bankGroomBank,
        bgnm: weddingData.bankGroomNumber,
        bbn: weddingData.bankBrideName,
        bbb: weddingData.bankBrideBank,
        bbnm: weddingData.bankBrideNumber,
        p: weddingData.photos.slice(0, 10)
      };
      
      const jsonStr = JSON.stringify(minData);
      return LZString.compressToEncodedURIComponent(jsonStr);
    }

    // Unpack Data from URL
    function parseUrlParams() {
      const hash = window.location.hash.substring(1);
      const urlParams = new URLSearchParams(window.location.search);
      const compressedData = hash || urlParams.get('d');

      if (compressedData) {
        try {
          const decompressed = LZString.decompressFromEncodedURIComponent(compressedData);
          if (decompressed) {
            const minData = JSON.parse(decompressed);
            weddingData.groomName = minData.gn || weddingData.groomName;
            weddingData.groomFamily = minData.gf || weddingData.groomFamily;
            weddingData.brideName = minData.bn || weddingData.brideName;
            weddingData.brideFamily = minData.bf || weddingData.brideFamily;
            weddingData.weddingDate = minData.d || weddingData.weddingDate;
            weddingData.weddingTime = minData.t || weddingData.weddingTime;
            weddingData.venueName = minData.vn || weddingData.venueName;
            weddingData.venueAddress = minData.va || weddingData.venueAddress;
            weddingData.mapUrl = minData.mu || weddingData.mapUrl;
            weddingData.bankGroomName = minData.bgn || weddingData.bankGroomName;
            weddingData.bankGroomBank = minData.bgb || weddingData.bankGroomBank;
            weddingData.bankGroomNumber = minData.bgnm || weddingData.bankGroomNumber;
            weddingData.bankBrideName = minData.bbn || weddingData.bankBrideName;
            weddingData.bankBrideBank = minData.bbb || weddingData.bankBrideBank;
            weddingData.bankBrideNumber = minData.bbnm || weddingData.bankBrideNumber;
            if (Array.isArray(minData.p) && minData.p.length > 0) {
              weddingData.photos = minData.p;
            }
            isViewMode = true;
          }
        } catch (e) {
          console.error("Failed to parse invitation hash payload", e);
        }
      }
    }

    // Auto-Compress Image Utility (Smart Compression)
    function compressImageFile(file, maxWidth = 600, quality = 0.5) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxWidth) {
                width = Math.round((width * maxWidth) / height);
                height = maxWidth;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Compress to standard JPEG format
            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    }

    // Handle Image Upload
    async function handlePhotoUpload(event, index) {
      const file = event.target.files[0];
      if (!file) return;

      if (file.size > 10 * 1024 * 1024) {
        showToast('Kích thước ảnh quá lớn (vui lòng chọn ảnh < 10MB)', 'error');
        return;
      }

      showToast('Đang nén tối ưu dung lượng ảnh...', 'info');

      try {
        const compressedBase64 = await compressImageFile(file, 600, 0.45);
        weddingData.photos[index] = compressedBase64;
        showToast(`Đã tải & tối ưu ảnh số ${index + 1} thành công!`);
        renderApp();
      } catch (err) {
        showToast('Lỗi xử lý nén ảnh!', 'error');
      }
    }

    function updatePhotoUrl(index, url) {
      weddingData.photos[index] = url.trim();
    }

    // API Call for TinyURL Auto Shortening
    async function createShortUrl() {
      isGeneratingShortUrl = true;
      renderApp();

      const compactHash = generateCompactPayload();
      const fullUrl = `${window.location.origin}${window.location.pathname}#${compactHash}`;

      try {
        // Fetch tinyurl API
        const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(fullUrl)}`);
        
        if (response.ok) {
          const shortUrl = await response.text();
          if (shortUrl && shortUrl.startsWith('http')) {
            shortUrlResult = shortUrl;
            showToast('Tạo link rút gọn siêu ngắn thành công!');
          } else {
            throw new Error('Cú pháp link không hợp lệ');
          }
        } else {
          throw new Error('Không thể kết nối dịch vụ TinyURL');
        }
      } catch (err) {
        console.warn('TinyURL API Error/CORS Fallback:', err);
        // Fallback to local full URL if API fails
        shortUrlResult = fullUrl;
        showToast('Không thể kết nối TinyURL. Đã dùng link trực tiếp.', 'info');
      } finally {
        isGeneratingShortUrl = false;
        renderApp();
      }
    }

    function copyToClipboard(text) {
      const dummy = document.createElement('textarea');
      document.body.appendChild(dummy);
      dummy.value = text;
      dummy.select();
      document.execCommand('copy');
      document.body.removeChild(dummy);
      showToast('Đã sao chép link thành công!');
    }

    // Countdown Timer logic
    let countdownInterval;
    function startCountdown() {
      if (countdownInterval) clearInterval(countdownInterval);

      const updateTimer = () => {
        const targetDate = new Date(`${weddingData.weddingDate}T${weddingData.weddingTime}:00`);
        const now = new Date();
        const diff = targetDate - now;

        const dEl = document.getElementById('cd-days');
        const hEl = document.getElementById('cd-hours');
        const mEl = document.getElementById('cd-mins');
        const sEl = document.getElementById('cd-secs');

        if (!dEl) return;

        if (diff <= 0) {
          dEl.innerText = '00';
          hEl.innerText = '00';
          mEl.innerText = '00';
          sEl.innerText = '00';
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / 1000 / 60) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        dEl.innerText = String(days).padStart(2, '0');
        hEl.innerText = String(hours).padStart(2, '0');
        mEl.innerText = String(minutes).padStart(2, '0');
        sEl.innerText = String(seconds).padStart(2, '0');
      };

      updateTimer();
      countdownInterval = setInterval(updateTimer, 1000);
    }

    // Lightbox Functionality
    function openLightbox(index) {
      currentLightboxIdx = index;
      const lightbox = document.getElementById('lightbox');
      const img = document.getElementById('lightbox-img');
      const counter = document.getElementById('lightbox-counter');
      const caption = document.getElementById('lightbox-caption');

      img.src = weddingData.photos[currentLightboxIdx];
      counter.innerText = `${currentLightboxIdx + 1} / ${weddingData.photos.length}`;
      caption.innerText = `Kỷ niệm cưới ${weddingData.groomName} & ${weddingData.brideName} - Ảnh ${currentLightboxIdx + 1}`;

      lightbox.classList.remove('hidden');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.add('hidden');
    }

    function prevLightboxImage() {
      currentLightboxIdx = (currentLightboxIdx - 1 + weddingData.photos.length) % weddingData.photos.length;
      openLightbox(currentLightboxIdx);
    }

    function nextLightboxImage() {
      currentLightboxIdx = (currentLightboxIdx + 1) % weddingData.photos.length;
      openLightbox(currentLightboxIdx);
    }

    // Form inputs handling
    function updateField(field, value) {
      weddingData[field] = value;
    }

    // Add Guest RSVP Wish
    function submitRSVP(e) {
      e.preventDefault();
      const nameInput = document.getElementById('rsvp-name');
      const wishInput = document.getElementById('rsvp-wish');
      const statusSelect = document.getElementById('rsvp-status');

      if (!nameInput.value.trim() || !wishInput.value.trim()) {
        showToast('Vui lòng nhập tên và lời chúc của bạn', 'error');
        return;
      }

      weddingData.wishes.unshift({
        name: nameInput.value.trim(),
        wish: wishInput.value.trim(),
        status: statusSelect.value,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      });

      nameInput.value = '';
      wishInput.value = '';
      showToast('Cảm ơn bạn đã gửi lời chúc mừng!');
      renderApp();
    }

    // Render Full UI
    function renderApp() {

                </div>

                ${weddingData.mapUrl ? `
                  <div class="pt-2">

                      <i class="fas fa-directions"></i> Xem Bản Đồ Chỉ Đường
                    </a>
                  </div>
                ` : ''}
              </div>
            </section>

            <!-- 10 Photo Album Gallery -->
            <section class="space-y-4">
              <div class="text-center">
                <h2 class="text-2xl font-bold text-slate-800">Album Ảnh Cưới</h2>
                <p class="text-xs text-slate-500 mt-1">Chạm vào ảnh bất kỳ để xem phóng to full màn hình</p>
              </div>

              <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                ${weddingData.photos.map((src, i) => `
                  <div onclick="openLightbox(${i})" class="group relative aspect-square bg-slate-200 rounded-xl overflow-hidden cursor-pointer shadow-sm hover:shadow-md transition-all">
                    <img src="${src}" alt="Ảnh cưới ${i+1}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500" onerror="this.src='https://placehold.co/400x400/ffe4e6/be123c?text=Anh+Cuoi+${i+1}'">
                    <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center text-white">

            <!-- Gift / QR Section -->

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 max-w-2xl mx-auto">
